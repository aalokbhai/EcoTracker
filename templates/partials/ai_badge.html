{% load eco_tags %}
{% if c.ai_verified is None %}<span class="badge-soft b-muted"><i class="bi bi-dash-circle"></i> {% t "Not checked" %}</span>
{% elif c.ai_verified %}<span class="badge-soft b-success"><i class="bi bi-patch-check-fill"></i> {% t "AI verified" %}</span>
{% else %}<span class="badge-soft b-danger"><i class="bi bi-exclamation-triangle-fill"></i> {% t "Needs review" %}</span>
{% endif %}
