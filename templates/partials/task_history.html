{% load eco_tags %}
{% if history %}
<div class="card-x p-4 mb-3">
    <h6 class="fw-bold mb-3"><i class="bi bi-clock-history me-1"></i> {% t "Activity log" %}</h6>
    <div class="log-list">
        {% for h in history %}
        <div class="log-item">
            <div class="d-flex justify-content-between gap-2">
                <strong>{% t h.get_event_display %}</strong>
                <span class="text-muted small text-nowrap">{{ h.created_at|date:"d M, h:i A" }}</span>
            </div>
            <div class="small text-muted">{% if h.actor %}{{ h.actor.get_full_name|default:h.actor.username }}{% endif %}</div>
            {% if h.note %}<div class="small mt-1">{{ h.note }}</div>{% endif %}
        </div>
        {% endfor %}
    </div>
</div>
{% endif %}
